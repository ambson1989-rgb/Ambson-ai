name: Daily reel post

# Two posts per day (IST)
#   08:00 IST = 02:30 UTC
#   20:00 IST = 14:30 UTC
on:
  schedule:
    - cron: "30 2 * * *"
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      content_mode:
        description: "auto | trend | scenic"
        required: false
        default: "auto"

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ffmpeg
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/ffmpeg.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp
          FFMPEG_DIR=$(echo /tmp/ffmpeg-*-linux64-gpl)
          sudo cp "$FFMPEG_DIR/bin/ffmpeg" /usr/local/bin/ffmpeg
          sudo cp "$FFMPEG_DIR/bin/ffprobe" /usr/local/bin/ffprobe
          sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe
          ffmpeg -version | head -1

      - run: pip install -r requirements.txt

      - name: Resolve content mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.content_mode }}"
            MODE="${MODE:-auto}"
          else
            MODE="auto"
          fi
          echo "CONTENT_MODE=$MODE" >> "$GITHUB_ENV"
          echo "Using CONTENT_MODE=$MODE"

      - name: Run pipeline
        env:
          CONTENT_MODE: ${{ env.CONTENT_MODE }}
          MAX_REEL_SECONDS: "58"
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          SKIP_SAFETY_GATE: ${{ secrets.SKIP_SAFETY_GATE }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLLINATIONS_MODEL: ${{ secrets.POLLINATIONS_MODEL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_IMAGE_MODEL: ${{ secrets.HF_IMAGE_MODEL }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_IMAGE_MODEL: ${{ secrets.CF_IMAGE_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SCENIC_BGM_URL: ${{ secrets.SCENIC_BGM_URL }}
          PUBLIC_MEDIA_BUCKET: ${{ secrets.PUBLIC_MEDIA_BUCKET }}
          PUBLIC_MEDIA_ACCESS_KEY: ${{ secrets.PUBLIC_MEDIA_ACCESS_KEY }}
          PUBLIC_MEDIA_SECRET_KEY: ${{ secrets.PUBLIC_MEDIA_SECRET_KEY }}
          PUBLIC_MEDIA_BASE_URL: ${{ secrets.PUBLIC_MEDIA_BASE_URL }}
          PUBLIC_MEDIA_ENDPOINT: ${{ secrets.PUBLIC_MEDIA_ENDPOINT }}
          PUBLIC_MEDIA_REGION: ${{ secrets.PUBLIC_MEDIA_REGION }}
          PUBLIC_MEDIA_PREFIX: ${{ secrets.PUBLIC_MEDIA_PREFIX }}
          R2_KEEP_OBJECTS: ${{ secrets.R2_KEEP_OBJECTS }}
          AFFILIATE_LINK: ${{ secrets.AFFILIATE_LINK }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          CLEANUP_RENDERS: "1"
        run: python pipeline.py

      - name: Persist rotation state
        if: always()
        run: |
          git config user.name "reels-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main || true
          git add script_state.json || true
          if git diff --cached --quiet; then
            echo "No state change to commit"
          else
            git commit -m "chore: update used-topics / script state"
            git pull --rebase origin main
            git push
          fi
