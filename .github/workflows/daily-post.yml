name: Daily reel post

# Normal days: 08:00 + 20:00 IST (with +30min backups).
# TODAY ONLY (2026-10-04 IST): also fire every ~3 hours.
#
# UTC slots (IST = UTC+5:30):
#   02:30 / 03:00  → 08:00 / 08:30 IST
#   06:30          → 12:00 IST  (boost day)
#   09:30          → 15:00 IST  (boost day)
#   12:30          → 18:00 IST  (boost day)
#   14:30 / 15:00  → 20:00 / 20:30 IST
#   15:30          → 21:00 IST  (boost day)
#   18:30          → 00:00 IST next (boost day edge)
on:
  schedule:
    - cron: "30 2 * * *"
    - cron: "0 3 * * *"
    - cron: "30 6 * * *"
    - cron: "30 9 * * *"
    - cron: "30 12 * * *"
    - cron: "30 14 * * *"
    - cron: "0 15 * * *"
    - cron: "30 15 * * *"
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      content_mode:
        description: "trend only (scenic disabled)"
        required: false
        default: "trend"

permissions:
  contents: write

concurrency:
  group: daily-reel-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Schedule gate (boost day vs normal)
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          from datetime import datetime, timezone, timedelta, date

          IST = timezone(timedelta(hours=5, minutes=30))
          now_ist = datetime.now(IST)
          today = now_ist.date()
          hour = now_ist.hour
          minute = now_ist.minute

          BOOST_DAY = date(2026, 10, 4)  # every 3h today only

          print(f"IST now={now_ist.isoformat()} date={today} hour={hour}")

          def mark_skip(reason: str) -> None:
              print("SKIP:", reason)
              open("/tmp/skip_pipeline", "w").write("1")

          # --- date / slot policy ---
          if today == BOOST_DAY:
              # Allow posts all day; anti-spam window ~2h45m below
              print("BOOST DAY: every ~3 hours allowed")
          else:
              # Normal days: only morning (~8) or evening (~20) IST windows
              morning = 7 <= hour <= 9
              evening = 19 <= hour <= 21
              if not (morning or evening):
                  mark_skip(f"normal day — outside 8AM/8PM windows (hour={hour})")
                  sys.exit(0)
              print("Normal day — inside AM/PM window")

          # --- recently posted? ---
          path = "script_state.json"
          if not os.path.exists(path):
              print("No script_state.json — continue")
              sys.exit(0)
          try:
              data = json.load(open(path))
          except Exception as e:
              print("Could not read state:", e)
              sys.exit(0)

          raw = (data.get("last_run_date") or "").strip()
          if not raw:
              print("No last_run_date — continue")
              sys.exit(0)
          try:
              ts = raw.replace("Z", "+00:00")
              last = datetime.fromisoformat(ts)
              if last.tzinfo is None:
                  last = last.replace(tzinfo=timezone.utc)
          except Exception as e:
              print("Bad last_run_date", raw, e)
              sys.exit(0)

          age = datetime.now(timezone.utc) - last.astimezone(timezone.utc)
          print(f"Last run: {last.isoformat()} age={age}")

          # Tighter window on boost day so 3h cadence can fire
          min_gap = timedelta(hours=2, minutes=45) if today == BOOST_DAY else timedelta(hours=5)
          if age < min_gap:
              mark_skip(f"already posted within {min_gap} (age={age})")
              sys.exit(0)

          print("Continue: schedule gate passed")
          PY

      - name: Check skip marker
        id: gate
        run: |
          if [ -f /tmp/skip_pipeline ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Pipeline skipped"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ffmpeg
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/ffmpeg.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp
          FFMPEG_DIR=$(echo /tmp/ffmpeg-*-linux64-gpl)
          sudo cp "$FFMPEG_DIR/bin/ffmpeg" /usr/local/bin/ffmpeg
          sudo cp "$FFMPEG_DIR/bin/ffprobe" /usr/local/bin/ffprobe
          sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe
          ffmpeg -version | head -1

      - name: Install Python deps
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Resolve content mode
        if: steps.gate.outputs.skip != 'true'
        run: |
          echo "CONTENT_MODE=trend" >> "$GITHUB_ENV"
          echo "Using CONTENT_MODE=trend (scenic disabled)"

      - name: Run pipeline
        if: steps.gate.outputs.skip != 'true'
        env:
          CONTENT_MODE: trend
          MAX_REEL_SECONDS: "58"
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          SKIP_SAFETY_GATE: ${{ secrets.SKIP_SAFETY_GATE }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLLINATIONS_MODEL: ${{ secrets.POLLINATIONS_MODEL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_IMAGE_MODEL: ${{ secrets.HF_IMAGE_MODEL }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_IMAGE_MODEL: ${{ secrets.CF_IMAGE_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PUBLIC_MEDIA_BUCKET: ${{ secrets.PUBLIC_MEDIA_BUCKET }}
          PUBLIC_MEDIA_ACCESS_KEY: ${{ secrets.PUBLIC_MEDIA_ACCESS_KEY }}
          PUBLIC_MEDIA_SECRET_KEY: ${{ secrets.PUBLIC_MEDIA_SECRET_KEY }}
          PUBLIC_MEDIA_BASE_URL: ${{ secrets.PUBLIC_MEDIA_BASE_URL }}
          PUBLIC_MEDIA_ENDPOINT: ${{ secrets.PUBLIC_MEDIA_ENDPOINT }}
          PUBLIC_MEDIA_REGION: ${{ secrets.PUBLIC_MEDIA_REGION }}
          PUBLIC_MEDIA_PREFIX: ${{ secrets.PUBLIC_MEDIA_PREFIX }}
          R2_KEEP_OBJECTS: ${{ secrets.R2_KEEP_OBJECTS }}
          AFFILIATE_LINK: ${{ secrets.AFFILIATE_LINK }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          CLEANUP_RENDERS: "1"
        run: python pipeline.py

      - name: Persist rotation state
        if: always() && steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "reels-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add script_state.json || true
          if git diff --cached --quiet; then
            echo "No state change to commit"
          else
            git stash push -u -m "temp-before-rebase" || true
            git pull --rebase origin main || true
            git stash pop || true
            git add script_state.json || true
            git commit -m "chore: update used-topics / script state" || true
            git pull --rebase origin main || true
            git push || true
          fi
