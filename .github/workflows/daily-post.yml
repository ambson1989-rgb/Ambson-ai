name: Daily reel post

on:
  schedule:
    - cron: "30 9 * * *"   # 9:30 UTC daily — edit to your preferred posting time
  workflow_dispatch: {}     # "Run workflow" button for manual tests

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PUBLIC_MEDIA_BUCKET: ${{ secrets.PUBLIC_MEDIA_BUCKET }}
          PUBLIC_MEDIA_ACCESS_KEY: ${{ secrets.PUBLIC_MEDIA_ACCESS_KEY }}
          PUBLIC_MEDIA_SECRET_KEY: ${{ secrets.PUBLIC_MEDIA_SECRET_KEY }}
          PUBLIC_MEDIA_BASE_URL: ${{ secrets.PUBLIC_MEDIA_BASE_URL }}
          PUBLIC_MEDIA_ENDPOINT: ${{ secrets.PUBLIC_MEDIA_ENDPOINT }}
          PUBLIC_MEDIA_REGION: ${{ secrets.PUBLIC_MEDIA_REGION }}
          PUBLIC_MEDIA_PREFIX: ${{ secrets.PUBLIC_MEDIA_PREFIX }}
          AFFILIATE_LINK: ${{ secrets.AFFILIATE_LINK }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          CLEANUP_RENDERS: "1"
        run: python pipeline.py

      - name: Persist script rotation state
        run: |
          git config user.name "reels-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add script_state.json
          git diff --cached --quiet || git commit -m "chore: update script rotation state"
          git push
