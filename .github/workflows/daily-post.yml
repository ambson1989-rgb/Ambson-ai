name: Daily reel post

# SCHEDULES DISABLED until a full publish succeeds on latest main.
on:
  # schedule:
  #   - cron: "30 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # BtbN gpl build includes libfreetype (needed for drawtext captions).
      # johnvansickle static builds often lack drawtext → ffmpeg exit 8.
      - name: Install ffmpeg
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/ffmpeg.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp
          FFMPEG_DIR=$(echo /tmp/ffmpeg-*-linux64-gpl)
          sudo cp "$FFMPEG_DIR/bin/ffmpeg" /usr/local/bin/ffmpeg
          sudo cp "$FFMPEG_DIR/bin/ffprobe" /usr/local/bin/ffprobe
          sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe
          ffmpeg -version | head -1
          ffmpeg -filters 2>/dev/null | grep -q drawtext && echo "drawtext: OK"

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLLINATIONS_MODEL: ${{ secrets.POLLINATIONS_MODEL }}
          PUBLIC_MEDIA_BUCKET: ${{ secrets.PUBLIC_MEDIA_BUCKET }}
          PUBLIC_MEDIA_ACCESS_KEY: ${{ secrets.PUBLIC_MEDIA_ACCESS_KEY }}
          PUBLIC_MEDIA_SECRET_KEY: ${{ secrets.PUBLIC_MEDIA_SECRET_KEY }}
          PUBLIC_MEDIA_BASE_URL: ${{ secrets.PUBLIC_MEDIA_BASE_URL }}
          PUBLIC_MEDIA_ENDPOINT: ${{ secrets.PUBLIC_MEDIA_ENDPOINT }}
          PUBLIC_MEDIA_REGION: ${{ secrets.PUBLIC_MEDIA_REGION }}
          PUBLIC_MEDIA_PREFIX: ${{ secrets.PUBLIC_MEDIA_PREFIX }}
          AFFILIATE_LINK: ${{ secrets.AFFILIATE_LINK }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          CLEANUP_RENDERS: "1"
        run: python pipeline.py

      - name: Persist script rotation state
        if: always()
        run: |
          git config user.name "reels-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main || true
          git add script_state.json || true
          if git diff --cached --quiet; then
            echo "No state change to commit"
          else
            git commit -m "chore: update script rotation state"
            git pull --rebase origin main
            git push
          fi
