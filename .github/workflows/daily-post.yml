name: Daily reel post

on:
  schedule:
    - cron: "30 9 * * *"   # 9:30 UTC daily — edit to your preferred posting time
  workflow_dispatch: {}     # adds a "Run workflow" button in the Actions tab, for manual testing

permissions:
  contents: write            # needed so the job can commit updated state back to the repo

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PUBLIC_MEDIA_BASE_URL: ${{ secrets.PUBLIC_MEDIA_BASE_URL }}
          AFFILIATE_LINK: ${{ secrets.AFFILIATE_LINK }}
        run: python pipeline.py

      # Runners are thrown away after every run, so script_state.json has to be
      # committed back or the script rotation resets on every post. This commit
      # also counts as repo activity, which keeps GitHub from auto-disabling
      # the schedule after 60 days of no activity.
      - name: Persist script rotation state
        run: |
          git config user.name "reels-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add script_state.json
          git diff --cached --quiet || git commit -m "chore: update script rotation state"
          git push
