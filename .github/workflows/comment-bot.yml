name: Reply to comments

# Manual only — schedule off to avoid IG integrity checks.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Run comment bot
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          COMMENT_MAX_REPLIES: "10"
          COMMENT_MEDIA_LIMIT: "5"
          COMMENT_MIN_DELAY_SEC: "30"
          COMMENT_MAX_DELAY_SEC: "90"
        run: python run_comment_bot.py

      - name: Persist replied-comment state
        if: always()
        run: |
          git config user.name "reels-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main || true
          git add replied_comments.json || true
          if git diff --cached --quiet; then
            echo "No state change"
          else
            git commit -m "chore: update replied-comments state"
            git pull --rebase origin main
            git push
          fi
