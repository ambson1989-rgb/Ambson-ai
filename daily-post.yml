name: Daily reel post

on:
  schedule:
    - cron: "30 9 * * *"   # 9:30 UTC daily — edit to your preferred posting time
  workflow_dispatch: {}     # adds a "Run workflow" button in the Actions tab, for manual testing

permissions:
  contents: write            # needed so the job can commit updated state back to the repo

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VIDEO_GEN_PROVIDER: replicate
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          REPLICATE_MODEL_VERSION: ${{ secrets.REPLICATE_MODEL_VERSION }}
          PUBLIC_MEDIA_BASE_URL: ${{ secrets.PUBLIC_MEDIA_BASE_URL }}
          AFFILIATE_LINK: ${{ secrets.AFFILIATE_LINK }}
        run: python pipeline.py

      # Runners are thrown away after every run, so trend_state.json has to be
      # committed back or the topic rotation resets on every post. This commit
      # also counts as repo activity, which keeps GitHub from auto-disabling
      # the schedule after 60 days of no activity.
      - name: Persist topic rotation state
        run: |
          git config user.name "reels-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add trend_state.json
          git diff --cached --quiet || git commit -m "chore: update topic rotation state"
          git push
